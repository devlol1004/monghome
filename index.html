
<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MintLabel | Digital Product Passport Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F8F6;
            --text-color: #121212;
            --mint-color: #00FF85;
            --grid-opacity: 0.08;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.05;
            -webkit-font-smoothing: antialiased;
            word-break: keep-all;
        }
        .mono {
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.1em;
        }
        .grid-line {
            border-color: rgba(18, 18, 18, var(--grid-opacity));
        }
        .giant-text {
            font-size: clamp(3rem, 11vw, 12rem);
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 0.8;
            text-transform: uppercase;
        }
        .italic-mint {
            font-style: italic;
            color: var(--mint-color);
        }
        ::selection {
            background-color: var(--mint-color);
            color: var(--text-color);
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: fit-content;
            animation: marquee 50s linear infinite;
        }
        .section-container {
            max-w: 1600px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 5vw;
            padding-right: 5vw;
        }
        /* Industrial Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #121212;
        }
    </style>

</body>
</html>
